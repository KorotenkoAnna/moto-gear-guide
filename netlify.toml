[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Trailing-slash / canonical handling for restored legacy URLs.
# Real 301 redirects for the old domain's non-preserved URLs will be added
# here later as a separate step (see the "ТЗ: 301-редиректы" doc).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
